<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perpustakaan Digital</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #00bcd4;
            color: white;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 90%;
            max-width: 1200px;
            margin: 0 auto;
            padding-top: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            font-weight: bold;
        }
        .header .user-icon {
            display: flex;
            align-items: center;
        }
        .header .user-icon::before {
            content: "👤";
            margin-right: 8px;
            font-size: 20px;
        }
        .menu {
            display: flex;
            gap: 30px;
            font-size: 16px;
        }
        .menu a {
            color: rgb(0, 0, 0);
            text-decoration: none;
        }
        .welcome-section {
            background-image: url('bg2.jpg');
            background-size: cover;
            background-position: center;
            padding: 50px 0;
            text-align: center;
            color: white;
            position: relative;
        }
        .welcome-section h1 {
            font-size: 48px;
            font-weight: bold;
            margin: 0;
        }
        .search-bar {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            position: relative;
        }
        .search-bar input {
            width: 50%;
            padding: 10px 15px;
            border-radius: 20px;
            border: none;
            outline: none;
            font-size: 16px;
        }
        .search-bar button {
            position: absolute;
            right: calc(25% + 15px);
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #333;
            font-size: 18px;
            cursor: pointer;
        }
        .main-content {
            display: flex;
            margin-top: 20px;
        }
        .sidebar {
            flex: 1;
            margin-right: 20px;
        }
        .sidebar .categories {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .categories button {
            background-color: #d4a017;
            border: none;
            padding: 10px;
            border-radius: 20px;
            cursor: pointer;
            color: #fff;
            font-weight: bold;
            text-align: left;
            transition: background-color 0.3s;
            width: 100%;
        }
        .categories button:hover {
            background-color: #b38a0f;
        }
        .book-list {
            flex: 3;
            display: flex;
            gap: 20px;
            justify-content: start;
            flex-wrap: wrap;
        }
        .book-item {
            width: 150px;
            text-align: center;
            color: #333;
        }
        .book-item img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .book-item p {
            margin: 10px 0 5px;
            font-size: 14px;
        }
        .book-item button {
            background-color: #d4a017;
            border: none;
            padding: 5px 20px;
            border-radius: 20px;
            cursor: pointer;
            color: #fff;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .book-item button:hover {
            background-color: #b38a0f;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="user-icon">User</div>
        <div class="menu">
            <a href="#">PENGEMBALIAN BUKU</a>
            <a href="#">MENINJAM BUKU</a>
            <a href="#">DAFTAR BACAAN</a>
        </div>
    </div>

    <div class="welcome-section">
        <h1>SELAMAT DATANG</h1>
        <div class="search-bar">
            <input type="text" placeholder="Cari">
            <button>🔍</button>
        </div>
    </div>

    <div class="main-content">
        <!-- Sidebar Kategori -->
        <div class="sidebar">
            <div class="categories">
                <button>Buku Terbaru</button>
                <button>Psikologi</button>
                <button>Fiksi</button>
                <button>Sains</button>
            </div>
        </div>

        <!-- Daftar Buku -->
        <div class="book-list">
            <div class="book-item">
                <img src="kimia.jpg" alt="Kimia Forensik">
                <p>Kimia Forensik<br><small>Prof. Riyanto</small></p>
                <button>Baca</button>
            </div>
            <div class="book-item">
                <img src="raunghati.jpg" alt="Raung Hati">
                <p>Raung Hati<br><small>Dan Puan</small></p>
                <button>Baca</button>
            </div>
            <div class="book-item">
                <img src="hatihati.jpg" alt="Hati-Hati dengan Hati">
                <p>Hati-Hati dengan Hati<br><small>Dr. Hans Tandra</small></p>
                <button>Baca</button>
            </div>
            <div class="book-item">
                <img src="sql.jpg" alt="Belajar cepat database nosql">
                <p>Saya Bukan Siapa-Siapa<br><small></p>
                <button>Baca</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
